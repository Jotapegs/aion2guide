appId: com.jotapegs.aion2guide
productName: Aion 2 Guide
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
